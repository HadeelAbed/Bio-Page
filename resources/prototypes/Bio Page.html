<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هديل أبو صفية | Hadeel Abu Safiya</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- خط أنيق ومتناسق -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Tajawal", "Plus Jakarta Sans", sans-serif;
      }

      /* تأثير التلاشي التدريجي للهيدر لدمجه بالخلفية */
      .header-mask {
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 1) 60%,
          rgba(0, 0, 0, 0) 100%
        );
        -webkit-mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 1) 60%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      /* بطاقة الرابط الزجاجية مع تأثيرات الـ Hover المخصصة لشاشات اللابتوب والماوس */
      .glass-btn {
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 4px 18px 0 rgba(0, 0, 0, 0.04);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* تفاعل الماوس للابتوب والكمبيوتر */
      @media (hover: hover) {
        .glass-btn:hover {
          background: rgba(255, 255, 255, 0.48);
          border-color: rgba(255, 255, 255, 0.7);
          transform: translateY(-3px);
          box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.08);
        }
      }

      /* إخفاء شريط التمرير لمظهر فائق النقاء */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[#a87f83] flex items-center justify-center p-0 md:p-6 lg:p-10 selection:bg-rose-200"
  >
    <!-- خلفية محيطية تفاعلية للابتوب (Ambient Blur Glow) -->
    <div
      class="fixed inset-0 overflow-hidden pointer-events-none hidden md:block"
    >
      <div
        class="absolute -top-32 -left-32 w-96 h-96 bg-rose-300/30 rounded-full blur-3xl"
      ></div>
      <div
        class="absolute -bottom-32 -right-32 w-96 h-96 bg-stone-400/30 rounded-full blur-3xl"
      ></div>
    </div>

    <!-- الحاوية الرئيسية:
         - على الموبايل: عرض كامل (w-full) بدون حواف أو زوايا دائرية.
         - على اللابتوب: بطاقة عائمة في المنتصف (max-w-[440px]) بزوايا دائرية وظلال ناعمة وإطار راقٍ.
    -->
    <main
      class="w-full md:max-w-[440px] min-h-screen md:min-h-[820px] md:max-h-[90vh] overflow-y-auto relative flex flex-col items-center pb-12 bg-gradient-to-b from-[#b88c8f] via-[#c99a9e] to-[#ba8b8f] text-gray-900 md:rounded-[42px] md:shadow-[0_25px_60px_-15px_rgba(0,0,0,0.35)] md:border md:border-white/20"
    >
      <!-- أزرار المشاركة العلوية -->
      <header
        class="w-full absolute top-0 left-0 p-5 flex justify-between items-center z-20 text-white"
      >
        <button
          class="w-10 h-10 rounded-full bg-black/15 hover:bg-black/25 backdrop-blur-md border border-white/30 flex items-center justify-center transition shadow-sm"
          title="خيارات"
        >
          <i class="fa-solid fa-asterisk text-sm"></i>
        </button>
        <button
          class="w-10 h-10 rounded-full bg-black/15 hover:bg-black/25 backdrop-blur-md border border-white/30 flex items-center justify-center transition shadow-sm"
          title="مشاركة"
        >
          <i class="fa-solid fa-arrow-up-from-bracket text-sm"></i>
        </button>
      </header>

      <!-- الهيدر (صورة الغلاف الكبيرة مع التلاشي التدريجي) -->
      <section class="w-full h-80 relative overflow-hidden flex-shrink-0">
        <img
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop"
          alt="هديل أبو صفية"
          class="w-full h-full object-cover object-top header-mask"
        />
      </section>

      <!-- النصوص والمعلومات الشخصية -->
      <section
        class="w-full px-6 text-center mt-[-15px] z-10 flex flex-col items-center flex-shrink-0"
      >
        <h1 class="text-3xl font-serif tracking-wide font-normal text-gray-900">
          هديل أبو صفية
        </h1>
        <p
          class="text-xs md:text-sm font-light text-gray-800 mt-2 max-w-xs leading-relaxed"
        >
          Software Engineer & Graphic Designer
        </p>

        <!-- أيقونات السوشيال ميديا السريعة -->
        <div class="flex items-center gap-6 mt-4 text-xl text-gray-900">
          <a
            href="https://instagram.com"
            target="_blank"
            class="hover:text-black hover:scale-110 transition"
            ><i class="fa-brands fa-instagram"></i
          ></a>
          <a
            href="https://github.com"
            target="_blank"
            class="hover:text-black hover:scale-110 transition"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a
            href="https://linkedin.com"
            target="_blank"
            class="hover:text-black hover:scale-110 transition"
            ><i class="fa-brands fa-linkedin-in"></i
          ></a>
        </div>
      </section>

      <!-- قائمة الروابط الزجاجية (Glassmorphism Links) -->
      <section class="w-full px-6 mt-7 space-y-3.5 z-10">
        <!-- رابط مميز بصورة مصغرة -->
        <a
          href="https://behance.net"
          target="_blank"
          class="glass-btn flex items-center justify-between p-3.5 rounded-2xl w-full text-gray-900 font-medium group"
        >
          <div class="flex items-center gap-3">
            <img
              src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop"
              class="w-10 h-10 rounded-xl object-cover border border-white/60"
            />
            <span class="text-sm font-medium tracking-wide"
              >معرض أعمالي على بيهانس</span
            >
          </div>
          <i
            class="fa-solid fa-arrow-up-right-from-square text-gray-600 text-xs px-2 group-hover:text-gray-900 transition"
          ></i>
        </a>

        <!-- روابط مخصصة -->
        <a
          href="https://github.com"
          target="_blank"
          class="glass-btn flex items-center justify-between p-4 rounded-2xl w-full text-gray-900 font-medium group"
        >
          <span class="w-5"></span>
          <span class="text-sm tracking-wide text-center flex-1"
            >حسابي على GitHub ومشاريعي البرمجية</span
          >
          <i
            class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-xs px-1 group-hover:text-gray-900 transition"
          ></i>
        </a>

        <a
          href="https://linkedin.com"
          target="_blank"
          class="glass-btn flex items-center justify-between p-4 rounded-2xl w-full text-gray-900 font-medium group"
        >
          <span class="w-5"></span>
          <span class="text-sm tracking-wide text-center flex-1"
            >ملفي الشخصي على LinkedIn</span
          >
          <i
            class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-xs px-1 group-hover:text-gray-900 transition"
          ></i>
        </a>

        <a
          href="#"
          target="_blank"
          class="glass-btn flex items-center justify-between p-4 rounded-2xl w-full text-gray-900 font-medium group"
        >
          <span class="w-5"></span>
          <span class="text-sm tracking-wide text-center flex-1"
            >تواصل معي عبر واتساب</span
          >
          <i
            class="fa-solid fa-arrow-up-right-from-square text-gray-500 text-xs px-1 group-hover:text-gray-900 transition"
          ></i>
        </a>
      </section>

      <!-- فوتر هادئ اختياري لشعار المنصة -->
      <footer
        class="mt-auto pt-8 text-center text-xs text-gray-700/70 font-light"
      >
        <span>Powered by your platform</span>
      </footer>
    </main>
  </body>
</html>
