<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محرر الصفحة والروابط - هديل أبو صفية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js للتفاعل والتحديث اللحظي الفوري -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <!-- FontAwesome للأيقونات -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      /* تأثير التلاشي التدريجي للهيدر ودمجه مع التدرج اللوني */
      .header-mask {
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 1) 55%,
          rgba(0, 0, 0, 0) 100%
        );
        -webkit-mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 1) 55%,
          rgba(0, 0, 0, 0) 100%
        );
      }
      /* كلاس الزجاج Glassmorphism للروابط */
      .glass-btn {
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: all 0.25s ease;
      }
      /* إخفاء شريط التمرير داخل شاشة الموبايل مع الحفاظ على التمرير */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 font-sans text-gray-800"
    x-data="{
    // بيانات الملف الشخصي الافتراضية
    name: 'هديل أبو صفية',
    bio: 'Software Engineer & Graphic Designer',
    
    // الصورة الافتراضية
    headerImg: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop',
    
    // إعدادات الألوان القابلة للتخصيص
    bgColor1: '#b88c8f',
    bgColor2: '#ba8b8f',
    textColor: '#1a1a1a',
    buttonBg: 'rgba(255, 255, 255, 0.28)',
    buttonBorder: 'rgba(255, 255, 255, 0.45)',

    // باليتات ألوان سريعة جاهزة
    presets: [
        { name: 'Dusty Rose', c1: '#b88c8f', c2: '#ba8b8f', text: '#111827' },
        { name: 'Mocha Nude', c1: '#d7c4b7', c2: '#a48b78', text: '#1f1610' },
        { name: 'Olive Sage', c1: '#94a187', c2: '#68775c', text: '#142010' },
        { name: 'Dark Luxe', c1: '#1f1f23', c2: '#0e0e11', text: '#f3f4f6' },
        { name: 'Soft Lavender', c1: '#c4b5fd', c2: '#a78bfa', text: '#1e1b4b' }
    ],

    applyPreset(preset) {
        this.bgColor1 = preset.c1;
        this.bgColor2 = preset.c2;
        this.textColor = preset.text;
    },

    // دالة معاينة الصورة فور رفعها من الجهاز
    previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                this.headerImg = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    },

    // قائمة الروابط الأولية
    links: [
        { title: 'معرض أعمالي على بيهانس', url: 'https://behance.net' },
        { title: 'حسابي على GitHub', url: 'https://github.com' },
        { title: 'صفحة الإنستغرام', url: 'https://instagram.com' },
        { title: 'ملفي الشخصي على LinkedIn', url: 'https://linkedin.com' }
    ],

    addLink() {
        this.links.push({
            title: 'رابط جديد ' + (this.links.length + 1),
            url: 'https://'
        });
    },

    removeLink(index) {
        this.links.splice(index, 1);
    }
}"
  >
    <div class="min-h-screen flex flex-col lg:flex-row">
      <!-- ======================= الجانب الأيمن: لوحة التحكم والخيارات ======================= -->
      <aside
        class="w-full lg:w-1/2 p-6 lg:p-10 bg-white border-l border-gray-200 overflow-y-auto max-h-screen"
      >
        <div
          class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100"
        >
          <div>
            <h2 class="text-2xl font-bold text-gray-900">
              تخصيص الهوية والروابط
            </h2>
            <p class="text-xs text-gray-500 mt-1">
              ارفعي صورتك، اختاري ألوانك المفضلة، وأضيفي روابطك بحرية
            </p>
          </div>
          <button
            type="button"
            class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-sm transition"
          >
            حفظ ونشر الرابط
          </button>
        </div>

        <!-- 1. رفع وتعديل الصورة -->
        <div class="mb-8">
          <h3
            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3"
          >
            1. صورة الهيدر الشخصية
          </h3>
          <div class="flex items-center gap-4">
            <div
              class="w-20 h-20 rounded-2xl overflow-hidden border border-gray-200 shadow-sm flex-shrink-0"
            >
              <img :src="headerImg" class="w-full h-full object-cover" />
            </div>
            <div class="flex-1">
              <label
                class="cursor-pointer inline-flex items-center gap-2 bg-gray-50 hover:bg-gray-100 border border-gray-300 text-gray-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition"
              >
                <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                <span>اختيار صورة من جهازك</span>
                <input
                  type="file"
                  @change="previewImage($event)"
                  accept="image/*"
                  class="hidden"
                />
              </label>
              <p class="text-[11px] text-gray-400 mt-1.5">
                يفضل صورة عمودية أو مربعة عالية الدقة
              </p>
            </div>
          </div>
        </div>

        <!-- 2. تخصيص الألوان والتدرج -->
        <div class="mb-8 border-t border-gray-100 pt-6">
          <h3
            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3"
          >
            2. الألوان وتدرج الخلفية
          </h3>

          <!-- باليتات سريعة جاهزة -->
          <div class="mb-4">
            <label class="block text-xs font-medium text-gray-600 mb-2"
              >تدرجات جاهزة مقترحة:</label
            >
            <div class="flex flex-wrap gap-2">
              <template x-for="p in presets" :key="p.name">
                <button
                  @click="applyPreset(p)"
                  type="button"
                  class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 hover:border-gray-400 flex items-center gap-2 transition bg-white shadow-xs"
                >
                  <span
                    class="w-3.5 h-3.5 rounded-full border border-black/10 inline-block"
                    :style="`background: linear-gradient(to right, ${p.c1}, ${p.c2})`"
                  ></span>
                  <span x-text="p.name"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- منتقيات الألوان المخصصة -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
            <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
              <label
                class="block text-[11px] font-semibold text-gray-600 mb-1.5"
                >تدرج أعلى الخلفية</label
              >
              <div class="flex items-center gap-2">
                <input
                  type="color"
                  x-model="bgColor1"
                  class="w-10 h-9 rounded-lg cursor-pointer border border-gray-200 bg-white p-0.5"
                />
                <span
                  class="text-xs text-gray-600 font-mono"
                  x-text="bgColor1"
                ></span>
              </div>
            </div>

            <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
              <label
                class="block text-[11px] font-semibold text-gray-600 mb-1.5"
                >تدرج أسفل الخلفية</label
              >
              <div class="flex items-center gap-2">
                <input
                  type="color"
                  x-model="bgColor2"
                  class="w-10 h-9 rounded-lg cursor-pointer border border-gray-200 bg-white p-0.5"
                />
                <span
                  class="text-xs text-gray-600 font-mono"
                  x-text="bgColor2"
                ></span>
              </div>
            </div>

            <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
              <label
                class="block text-[11px] font-semibold text-gray-600 mb-1.5"
                >لون النصوص والأسماء</label
              >
              <div class="flex items-center gap-2">
                <input
                  type="color"
                  x-model="textColor"
                  class="w-10 h-9 rounded-lg cursor-pointer border border-gray-200 bg-white p-0.5"
                />
                <span
                  class="text-xs text-gray-600 font-mono"
                  x-text="textColor"
                ></span>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. المعلومات الشخصية -->
        <div class="space-y-4 mb-8 border-t border-gray-100 pt-6">
          <h3
            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
          >
            3. الاسم والنبذة التعريفية
          </h3>

          <div>
            <label class="block text-sm font-semibold mb-1"
              >الاسم الأساسي:</label
            >
            <input
              type="text"
              x-model="name"
              class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1"
              >النبذة (Bio):</label
            >
            <textarea
              x-model="bio"
              rows="2"
              class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
            ></textarea>
          </div>
        </div>

        <!-- 4. إضافة وتسمية أي رابط بحرية -->
        <div class="border-t border-gray-100 pt-6">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 class="text-lg font-bold text-gray-900">
                4. الروابط والأزرار المخصصة
              </h3>
              <p class="text-xs text-gray-500">
                أضيفي أي روابط ترغبين بها مع التسمية التي تفضلينها
              </p>
            </div>

            <button
              @click="addLink()"
              type="button"
              class="bg-gray-900 hover:bg-gray-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm"
            >
              <i class="fa-solid fa-plus text-[10px]"></i>
              <span>إضافة رابط</span>
            </button>
          </div>

          <div class="space-y-3">
            <template x-for="(link, index) in links" :key="index">
              <div
                class="p-3.5 bg-gray-50 hover:bg-gray-100/70 transition rounded-2xl border border-gray-200 flex items-center gap-3"
              >
                <div class="text-gray-400 px-1 cursor-grab">
                  <i class="fa-solid fa-grip-vertical"></i>
                </div>

                <div class="flex-1 space-y-2">
                  <div>
                    <label
                      class="block text-[11px] font-medium text-gray-500 mb-0.5"
                      >اسم الزر:</label
                    >
                    <input
                      type="text"
                      x-model="link.title"
                      placeholder="مثال: حسابي على تويتر، متجري، تيك توك..."
                      class="w-full text-xs font-semibold border border-gray-200 rounded-lg p-2.5 bg-white focus:outline-none focus:ring-1 focus:ring-rose-400"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-[11px] font-medium text-gray-500 mb-0.5"
                      >الرابط المباشر:</label
                    >
                    <input
                      type="url"
                      x-model="link.url"
                      placeholder="https://..."
                      class="w-full text-xs text-gray-600 border border-gray-200 rounded-lg p-2.5 bg-white focus:outline-none focus:ring-1 focus:ring-rose-400"
                      dir="ltr"
                    />
                  </div>
                </div>

                <button
                  @click="removeLink(index)"
                  type="button"
                  title="حذف"
                  class="w-9 h-9 flex items-center justify-center rounded-xl text-gray-400 hover:text-red-500 hover:bg-red-50 transition"
                >
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </template>
          </div>
        </div>
      </aside>

      <!-- ======================= الجانب الأيسر: شاشة الهاتف للمعاينة الحية الفورية ======================= -->
      <main
        class="w-full lg:w-1/2 bg-slate-100 flex items-center justify-center p-6 lg:p-10 sticky top-0 h-screen"
      >
        <!-- مجسم الهاتف الذكي -->
        <div
          class="w-[340px] h-[670px] bg-black rounded-[48px] p-3 shadow-2xl ring-1 ring-gray-900/15 relative flex flex-col"
        >
          <!-- الجزيرة التفاعلية (Dynamic Island) -->
          <div
            class="absolute top-4 left-1/2 -translate-x-1/2 w-24 h-4 bg-black rounded-full z-30"
          ></div>

          <!-- شاشة الهاتف الداخلية -->
          <div
            class="w-full h-full rounded-[40px] overflow-hidden flex flex-col relative no-scrollbar overflow-y-auto"
            :style="`background: linear-gradient(to bottom, ${bgColor1}, ${bgColor2})`"
          >
            <!-- صورة الهيدر مع التلاشي السلس -->
            <div class="w-full h-64 flex-shrink-0 relative overflow-hidden">
              <img
                :src="headerImg"
                class="w-full h-full object-cover object-top header-mask"
              />
            </div>

            <!-- الاسم والنبذة بلون الخط المختار -->
            <div
              class="px-5 text-center mt-[-15px] z-10 flex flex-col items-center flex-shrink-0"
              :style="`color: ${textColor}`"
            >
              <h4 class="text-xl font-serif font-normal" x-text="name"></h4>
              <p
                class="text-[11px] opacity-85 mt-1.5 leading-relaxed line-clamp-2"
                x-text="bio"
              ></p>
            </div>

            <!-- قائمة الأزرار الزجاجية -->
            <div class="px-4 mt-5 space-y-2.5 flex-1 pb-8">
              <template x-for="(link, idx) in links" :key="idx">
                <div
                  class="glass-btn flex items-center justify-between p-3.5 rounded-2xl shadow-xs"
                  :style="`background: ${buttonBg}; border: 1px solid ${buttonBorder}; color: ${textColor}`"
                >
                  <span class="w-3"></span>
                  <span
                    class="text-xs font-medium text-center truncate max-w-[200px]"
                    x-text="link.title || 'بدون عنوان'"
                  ></span>
                  <i
                    class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-60 px-1"
                  ></i>
                </div>
              </template>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
